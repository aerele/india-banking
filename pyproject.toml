[project]
name = "india_banking"
authors = [
    { name = "Aerele Technologies Private Limited", email = "support@aerele.in"}
]
description = "Indian Banking Integration with ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true